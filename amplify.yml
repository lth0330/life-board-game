# AWS Amplify Hosting 배포 설정 (GitHub main에 올리면 자동으로 이 순서대로 만듦)
# 게임 코드는 app/ 폴더 안에 있음
version: 1
applications:
  - appRoot: app
    backend:
      phases:
        preBuild:
          commands:
            # 이 컴퓨터와 같은 Node 24 (버전이 다르면 package-lock.json을 다르게 읽어 실패함)
            - nvm install 24
            - nvm use 24
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            # 로그인·방·행동 데이터(AWS)를 배포용으로 만들고, 접속 주소 파일(amplify_outputs.json)을 씀
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
